[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge"
version = "0.1.0"
description = "Local control plane for long-running coding agents across many git repositories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai-agents", "claude-code", "codex", "orchestration", "devtools", "git-worktree"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
# LoopForge deliberately has zero runtime dependencies — the whole control plane
# is standard library only. The agents it drives are external CLIs.
dependencies = []

[project.scripts]
loopforge = "loopforge.cli:main"

[tool.setuptools]
packages = ["loopforge"]
