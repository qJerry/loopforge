<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" width="1260" height="900" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>LoopForge architecture</title>
  <desc>Interfaces to HTTP API to control plane to worker execution to git isolation to your repositories.</desc>

  <style>
    :root {
      --bg:        #ffffff;
      --lane:      #f6f8fa;
      --lane-edge: #e4e8ed;
      --card:      #ffffff;
      --card-edge: #d5dbe2;
      --text:      #14181d;
      --muted:     #62707f;
      --faint:     #8b98a7;
      --wire:      #9aa7b6;
      --accent:    #6d4aff;
      --accent-sf: #f1edff;
      --accent-ed: #cfc2ff;
      --green:     #12805c;
      --green-sf:  #e8f6f0;
      --green-ed:  #a9ded0;
      --amber:     #9a6700;
      --amber-sf:  #fdf5e3;
      --amber-ed:  #e6d5a8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #0d1117;
        --lane:      #11161d;
        --lane-edge: #222a33;
        --card:      #171d26;
        --card-edge: #2d3947;
        --text:      #e8eef5;
        --muted:     #9aa8b8;
        --faint:     #6f7f91;
        --wire:      #4a5867;
        --accent:    #a68bff;
        --accent-sf: #1c1830;
        --accent-ed: #443a6e;
        --green:     #4ad2a5;
        --green-sf:  #0f2018;
        --green-ed:  #2a5b48;
        --amber:     #e3b341;
        --amber-sf:  #231d0e;
        --amber-ed:  #5c4a1c;
      }
    }
    .lane      { fill: var(--lane); stroke: var(--lane-edge); }
    .card      { fill: var(--card); stroke: var(--card-edge); }
    .card-a    { fill: var(--accent-sf); stroke: var(--accent-ed); }
    .card-g    { fill: var(--green-sf); stroke: var(--green-ed); }
    .card-m    { fill: var(--amber-sf); stroke: var(--amber-ed); }
    .t         { fill: var(--text); font-size: 15px; font-weight: 600; }
    .t-sm      { fill: var(--text); font-size: 13.5px; font-weight: 600; }
    .sub       { fill: var(--muted); font-size: 12px; }
    .mono      { fill: var(--muted); font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .mono-a    { fill: var(--accent); font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .lane-lbl  { fill: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    .wire      { stroke: var(--wire); fill: none; stroke-width: 1.6; }
    .wire-a    { stroke: var(--accent); fill: none; stroke-width: 1.8; }
    .wire-d    { stroke: var(--wire); fill: none; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .head      { fill: var(--wire); }
    .head-a    { fill: var(--accent); }
    .brand     { fill: var(--text); font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-sub { fill: var(--muted); font-size: 12.5px; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head-a"/>
    </marker>
  </defs>

  <rect width="1260" height="900" fill="var(--bg)"/>

  <!-- ══ header ══ -->
  <g transform="translate(40,44)">
    <rect x="0" y="-18" width="26" height="26" rx="7" class="card-a"/>
    <path d="M7 -5 a6 6 0 1 1 6 6" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="13" cy="1" r="2" fill="var(--accent)"/>
    <text x="38" y="2" class="brand">LoopForge</text>
    <text x="150" y="2" class="brand-sub">AI-driven engineering delivery platform for long-running coding agents</text>
  </g>
  <line x1="40" y1="66" x2="1160" y2="66" stroke="var(--lane-edge)" stroke-width="1"/>

  <!-- ══ lane 1 · interfaces ══ -->
  <rect x="40" y="88" width="1120" height="104" rx="12" class="lane"/>
  <text x="56" y="110" class="lane-lbl">INTERFACES</text>

  <g>
    <rect x="152" y="112" width="300" height="62" rx="9" class="card"/>
    <text x="172" y="138" class="t-sm">Web console</text>
    <text x="172" y="158" class="mono">React + Vite · served by the backend</text>
  </g>
  <g>
    <rect x="472" y="112" width="300" height="62" rx="9" class="card"/>
    <text x="492" y="138" class="t-sm">CLI</text>
    <text x="492" y="158" class="mono">python3 -m loopforge.cli … --json</text>
  </g>
  <g>
    <rect x="792" y="112" width="300" height="62" rx="9" class="card"/>
    <text x="812" y="138" class="t-sm">Timer</text>
    <text x="812" y="158" class="mono">built-in auto-tick · or your own cron</text>
  </g>

  <!-- ══ lane 2 · api ══ -->
  <path d="M302 174 L302 212" class="wire" marker-end="url(#a)"/>
  <path d="M622 174 L622 212" class="wire" marker-end="url(#a)"/>
  <path d="M942 174 L942 212" class="wire" marker-end="url(#a)"/>

  <g>
    <rect x="152" y="216" width="940" height="56" rx="9" class="card-a"/>
    <text x="176" y="241" class="t-sm">HTTP API · 127.0.0.1 only, bearer-token guarded</text>
    <text x="176" y="260" class="mono-a">GET /api/v1/projects · POST /api/v1/schedule-tick · POST …/tasks · GET …/runs · GET …/events</text>
  </g>

  <!-- ══ lane 3 · control plane ══ -->
  <path d="M622 272 L622 306" class="wire-a" marker-end="url(#aa)"/>

  <rect x="40" y="298" width="1120" height="198" rx="12" class="lane"/>
  <text x="56" y="320" class="lane-lbl">CONTROL PLANE</text>
  <text x="56" y="338" class="lane-lbl" opacity="0.6">PYTHON</text>

  <g>
    <rect x="152" y="330" width="226" height="68" rx="9" class="card"/>
    <text x="170" y="356" class="t-sm">Scheduler</text>
    <text x="170" y="375" class="sub">picks one project per tick,</text>
    <text x="170" y="389" class="sub">honours per-project cadence</text>
  </g>
  <g>
    <rect x="390" y="330" width="226" height="68" rx="9" class="card"/>
    <text x="408" y="356" class="t-sm">Project lock</text>
    <text x="408" y="375" class="sub">one run per repo, stale-lock</text>
    <text x="408" y="389" class="sub">detection, no double-drive</text>
  </g>
  <g>
    <rect x="628" y="330" width="226" height="68" rx="9" class="card"/>
    <text x="646" y="356" class="t-sm">Dispatch</text>
    <text x="646" y="375" class="sub">detached worker process,</text>
    <text x="646" y="389" class="sub">survives console restarts</text>
  </g>
  <g>
    <rect x="866" y="330" width="226" height="68" rx="9" class="card"/>
    <text x="884" y="356" class="t-sm">Task store</text>
    <text x="884" y="375" class="sub">one JSON per task, optimistic</text>
    <text x="884" y="389" class="sub">versioning, atomic writes</text>
  </g>

  <g>
    <rect x="152" y="410" width="298" height="66" rx="9" class="card"/>
    <text x="170" y="436" class="t-sm">Run &amp; event history</text>
    <text x="170" y="456" class="mono">index.jsonl · events.jsonl</text>
  </g>
  <g>
    <rect x="462" y="410" width="298" height="66" rx="9" class="card"/>
    <text x="480" y="436" class="t-sm">Token accounting</text>
    <text x="480" y="456" class="sub">per-run and per-task cost rollup</text>
  </g>
  <g>
    <rect x="772" y="410" width="320" height="66" rx="9" class="card"/>
    <text x="790" y="436" class="t-sm">Notifications</text>
    <text x="790" y="456" class="sub">webhook on blocked / timeout / done</text>
  </g>

  <!-- ══ lane 4 · execution ══ -->
  <path d="M622 496 L622 530" class="wire-a" marker-end="url(#aa)"/>

  <rect x="40" y="522" width="1120" height="126" rx="12" class="lane"/>
  <text x="56" y="544" class="lane-lbl">EXECUTION</text>

  <g>
    <rect x="152" y="552" width="262" height="78" rx="9" class="card-m"/>
    <text x="172" y="578" class="t-sm">Worker adapter</text>
    <text x="172" y="597" class="sub">builds prompt + argv, injects</text>
    <text x="172" y="611" class="sub">per-project proxy env, health-checks</text>
  </g>

  <path d="M414 591 L468 591" class="wire" marker-end="url(#a)"/>

  <g>
    <rect x="474" y="552" width="196" height="78" rx="9" class="card"/>
    <text x="492" y="578" class="t-sm">Claude Code</text>
    <text x="492" y="598" class="mono">claude -p …</text>
    <text x="492" y="616" class="sub">opus · sonnet · haiku</text>
  </g>
  <g>
    <rect x="686" y="552" width="196" height="78" rx="9" class="card"/>
    <text x="704" y="578" class="t-sm">Codex</text>
    <text x="704" y="598" class="mono">codex exec …</text>
    <text x="704" y="616" class="sub">sandboxed, headless</text>
  </g>
  <g>
    <rect x="898" y="552" width="194" height="78" rx="9" class="card"/>
    <text x="916" y="578" class="t-sm">Fake worker</text>
    <text x="916" y="598" class="mono">fake_codex</text>
    <text x="916" y="616" class="sub">demo &amp; CI, zero tokens</text>
  </g>

  <!-- ══ lane 5 · git isolation ══ -->
  <path d="M622 648 L622 682" class="wire-a" marker-end="url(#aa)"/>

  <rect x="40" y="674" width="1120" height="94" rx="12" class="lane"/>
  <text x="56" y="696" class="lane-lbl">GIT ISOLATION</text>

  <g>
    <rect x="152" y="700" width="298" height="52" rx="9" class="card-g"/>
    <text x="172" y="722" class="t-sm">Managed branch</text>
    <text x="172" y="741" class="mono">feature/&lt;task-id&gt;</text>
  </g>
  <g>
    <rect x="462" y="700" width="298" height="52" rx="9" class="card-g"/>
    <text x="482" y="722" class="t-sm">Dedicated worktree</text>
    <text x="482" y="741" class="sub">the agent never touches your checkout</text>
  </g>
  <g>
    <rect x="772" y="700" width="320" height="52" rx="9" class="card-g"/>
    <text x="792" y="722" class="t-sm">Ledger commit</text>
    <text x="792" y="741" class="sub">task JSON published to the default branch</text>
  </g>

  <!-- ══ lane 6 · repos ══ -->
  <path d="M622 768 L622 794" class="wire" marker-end="url(#a)"/>

  <rect x="40" y="786" width="1120" height="86" rx="12" class="lane"/>
  <text x="56" y="808" class="lane-lbl">YOUR REPOS</text>

  <g>
    <rect x="152" y="806" width="298" height="50" rx="9" class="card"/>
    <text x="172" y="826" class="t-sm">go-backend</text>
    <text x="172" y="845" class="mono">repo-a/.loopforge/</text>
  </g>
  <g>
    <rect x="462" y="806" width="298" height="50" rx="9" class="card"/>
    <text x="482" y="826" class="t-sm">react-frontend</text>
    <text x="482" y="845" class="mono">repo-b/.loopforge/</text>
  </g>
  <g>
    <rect x="772" y="806" width="320" height="50" rx="9" class="card"/>
    <text x="792" y="826" class="t-sm">…any git repo</text>
    <text x="792" y="845" class="mono">repo-c/.loopforge/</text>
  </g>

  <!-- feedback wire: results flow back up -->
  <path d="M1160 831 L1204 831 L1204 244 L1098 244" class="wire-d" marker-end="url(#a)"/>
  <text x="1222" y="540" class="lane-lbl" transform="rotate(-90 1222 540)" text-anchor="middle">RESULT · STATE · COST</text>
</svg>
